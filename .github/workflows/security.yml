name: Security audit
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Audit npm lockfiles
        run: |
          npm audit --audit-level=high
          npm --prefix server audit --audit-level=high
      - name: Check complete history for credential patterns
        shell: bash
        run: |
          found=0
          while read -r rev; do
            if git grep -IlE '(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' "$rev" -- .; then
              found=1
            fi
          done < <(git log --all --format='%H')
          exit "$found"
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.11'
      - name: Audit Python dependency resolution
        run: |
          python -m pip install pip-audit
          pip-audit -r ml-service/requirements.txt --format=json --output=/tmp/python-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-dependency-audit
          path: /tmp/python-audit.json
          retention-days: 7
